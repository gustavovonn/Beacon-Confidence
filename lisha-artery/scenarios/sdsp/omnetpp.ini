[General]


network = artery.envmod.World

cmdenv-express-mode = true
cmdenv-autoflush = true
debug-on-errors = true
print-undisposed = true
**.cmdenv-log-level = info

**.scalar-recording = true
**.vector-recording = true
**.statistic-recording = true
#**.ECDHLatencyTotal.record = vector
**.**.record = true
#outputvectormanager-class = "omnetpp::envir::SqliteOutputVectorManager"
#outputscalarmanager-class = "omnetpp::envir::SqliteOutputScalarManager"
*.radioMedium.pathLossType = "FreeSpacePathLoss"

*.node[*].wlan[*].typename = "VanetNic"
*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].wlan[*].radio.receiver.energyDetection = -85 dBm
*.node[*].wlan[*].radio.receiver.sensitivity = -82 dBm

*.node[*].vanetza[*].router.LinkLatency.result-recording-modes = histogram,vector

*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2018-01-26 09:15:00"
*.node[*].middleware.services = xmldoc("services.xml")
*.node[*].middleware.CA.transmission.result-recording-modes = all
*.node[*].middleware.CA.reception.result-recording-modes = all

*.node[*].posX.result-recording-modes = vector
*.node[*].posY.result-recording-modes = vector


warmup-period = 30s
sim-time-limit = 1000s

*.traci.core.startTime = 0s
*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.seed = 23423
*.traci.launcher.sumocfg = "sumo.sumocfg"
*.traci.launcher.sumo = "sumo-gui"
*.traci.nodes.typename = "InsertionDelayNodeManager"
*.traci.mapper.typename = "traci.MultiTypeModuleMapper"
*.traci.mapper.vehicleTypes = xmldoc("vehicles.xml")
*.traci.nodes.destroyVehiclesOnCrash = true

*.staticNodes.nodes = xmldoc("highway/RSU.xml")

*.withPhysicalEnvironment = true
*.physicalEnvironment.groundType = "FlatGround"

*.radioMedium.pathLossType = "Gemv2"
*.radioMedium.pathLoss.withSmallScaleVariations = false

**.identityRegistryModule = "idRegistry"

*.node[*].numRadios = 1
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].middleware.datetime = "2018-01-26 09:15:00"
*.node[*].middleware.services = xmldoc("services.xml")

*.rsu*.wlan[*].radio.transmitter.power = 47.9 mW
*.rsu*.middleware.datetime = "2018-01-26 09:15:00"
*.rsu*.middleware.services = xmldoc("rsuservices.xml")

[Config omnidirectional]
*.rsu*.wlan[*].radio.antennaType = "ConstantGainAntenna"
*.rsu*.wlan[*].radio.antenna.gain = 10dB

[Config directional]
*.staticNodes.directionalAntennas = true
*.rsu*.wlan[*].radio.antennaType = "ParabolicAntenna"
*.rsu*.wlan[*].radio.antenna.beamWidth = 35deg
*.rsu*.wlan[*].radio.antenna.maxGain = 10dB
*.rsu*.wlan[*].radio.antenna.minGain = -50dB

*.node[*].middleware.device.typename = "Device"
# ---- Coleta de métricas do Device ----
#*.node[*].middleware.device.authenticationLatency.result-recording-modes = vector,stats
#*.node[*].middleware.device.v2vLatency.result-recording-modes = vector,stats
*.node[*].middleware.device.ecdhLatencyTotal.record = true
