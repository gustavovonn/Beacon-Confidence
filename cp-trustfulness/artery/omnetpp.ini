[General]
network = artery.envmod.World

# Independent random streams. With one shared stream, any change in how many numbers some module
# draws (a ghost object, a different CPM order) re-rolled which vehicles are dishonest and all later noise.
# The mapper that assigns vehicle types gets its own stream, as in Artery's own scenarios/car2car-grid.
num-rngs = 7
*.traci.mapper.rng-0 = 1
*.traci.nodes.rng-0 = 2
*.node[*].middleware.Noise.rng-0 = 3
*.node[*].middleware.CP.rng-0 = 4
*.node[*].middleware.CA.rng-0 = 4
*.node[*].middleware.DR.rng-0 = 5
*.node[*].middleware.rng-0 = 6

# Environment and sensor model
**.identityRegistryModule = "idRegistry"
*.environmentModel.drawObstacles = true
*.environmentModel.drawVehicles = true
*.environmentModel.obstacleTypes = "building shop"
*.environmentModel.traciModule = "traci"
*.environmentModel.nodeMobilityModule = ".mobility"
*.node[*].environmentModel.sensors = xmldoc("config/sensors.xml")

# Physical radars only (see config/sensors.xml): Recommendation ITU-R M.2057-1 (2018), Radar B (high-resolution
# automotive radar, up to 100 m, receive 10 dB beamwidth +-25 deg), at the FRONT and BACK attachment points (2.5 m
# from the centre of a 5 m car). Must match Noise.sensorCoverage = "100:50:0:2.5,100:50:180:-2.5".
*.node[*].environmentModel.FrontRadar.fovRange = 100m
*.node[*].environmentModel.FrontRadar.fovAngle = 50
*.node[*].environmentModel.FrontRadar.numSegments = 6
*.node[*].environmentModel.RearRadar.fovRange = 100m
*.node[*].environmentModel.RearRadar.fovAngle = 50
*.node[*].environmentModel.RearRadar.numSegments = 6
# Coverage study only (config/sensors_surround.xml): ITU-R M.2057-1 Radar C (corner class, up to 100 m, receive 10 dB
# beamwidth +-30 deg) on the sides; unused with the default config/sensors.xml.
*.node[*].environmentModel.LeftRadar.attachmentPoint = "LEFT"
*.node[*].environmentModel.LeftRadar.fovRange = 100m
*.node[*].environmentModel.LeftRadar.fovAngle = 60
*.node[*].environmentModel.LeftRadar.numSegments = 6
*.node[*].environmentModel.RightRadar.attachmentPoint = "RIGHT"
*.node[*].environmentModel.RightRadar.fovRange = 100m
*.node[*].environmentModel.RightRadar.fovAngle = 60
*.node[*].environmentModel.RightRadar.numSegments = 6

# Traci base settings (Using SUMO-GUI as the single unified visual interface)
*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumo = "sumo"

# Disable drawing wireless links/circles in SUMO-GUI (keep SUMO clean for traffic & TraCI colors)
*.traci.core.drawIcons = false
*.traci.core.drawLinks = false
# *.traci.core.drawRadius = 150m

# Node mapping based on vehicles.xml
*.traci.nodes.typename = "InsertionDelayNodeManager"
*.traci.nodes.destroyVehiclesOnCrash = true
*.traci.mapper.typename = "traci.MultiTypeModuleMapper"
*.traci.mapper.vehicleTypes = xmldoc("config/vehicles.xml")

# Middleware settings
*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2026-01-01 12:00:00"

# Configure FaultyCaService (only applies to FaultyCars; run_cpm_experiment.py overrides per run)
*.node[*].middleware.CA.faultMode = "random_noise"
*.node[*].middleware.CA.faultMagnitude = 20m
*.node[*].middleware.CA.faultStartTime = 15s

# Positioning and perception errors (SensorNoiseService): referenced models, see its NED and
# cp-trustfulness/include/ErrorModels.h. The receiver's gates read the same values from there.
# (NED defaults: GNSS VeReMi Extension, radar Jacobs et al. / Allig et al.)

# Vanetza ETSI Security (TS 103 097 Packet Signing & Security Envelope)
# *.node[*].vanetza[*].security.typename = "SecurityEntity"
# *.node[*].vanetza[*].security.CryptoBackend = "CryptoPP"
# *.node[*].vanetza[*].security.CertificateProvider = "Naive"
# *.node[*].vanetza[*].security.CertificateValidator = "NullOk"
# *.node[*].vanetza[*].security.SignService = "straight"
# *.node[*].vanetza[*].security.VerifyService = "straight"

# Modular Strategy Selection
*.node[*].middleware.DR.drAlgorithm = "HistoryAwareCTRA"
*.node[*].middleware.DR.trustAlgorithm = "BetaReputation"  # Paper 1's TrustService (ignored by CollectiveTrustService)

# Result recording (SQLite)
result-dir = results/sqlite
outputvectormanager-class="omnetpp::envir::SqliteOutputVectorManager"
outputscalarmanager-class="omnetpp::envir::SqliteOutputScalarManager"
*.node[*].*.vector-recording = true
**.*.vector-recording = true

# OMNeT++ Qtenv Network Visualizer Settings (DONT TOUCH! It triggers segfaults in Qtenv)
*.visualizer.*VisualizerType = ""

# =============================================================================
# SCENARIO / MAP SELECTION
# Run with: ./run_simulation.sh --map [grid|rsu|lust|highway]
# =============================================================================

[Config grid]
description = "Lightweight Car2Car Grid (Best for fast benchmarking & Qtenv, <500MB RAM)"
*.traci.launcher.sumo = "sumo"
*.traci.launcher.sumocfg = "../../artery/scenarios/car2car-grid/grid.sumo.cfg"

[Config grid-gui]
description = "Lightweight Car2Car Grid with SUMO-GUI Visualization"
*.traci.launcher.sumo = "sumo-gui"
*.traci.launcher.sumocfg = "../../artery/scenarios/car2car-grid/grid.sumo.cfg"

[Config rsu]
description = "RSU Grid (High-density intersection with Roadside Units)"
*.traci.launcher.sumo = "sumo"
*.traci.launcher.sumocfg = "../../artery/scenarios/rsu_grid/grid_scenario.sumocfg"

[Config rsu-gui]
description = "RSU Grid with SUMO-GUI Visualization"
*.traci.launcher.sumo = "sumo-gui"
*.traci.launcher.sumocfg = "../../artery/scenarios/rsu_grid/grid_scenario.sumocfg"

[Config lust]
description = "Luxembourg LuST, 07:30, 1.61 km2 region of interest (config/lust)"
# LuST ships with a 1 s SUMO step; V2X runs at 10 Hz, so positions would be up to 1 s stale.
# Positions integrate every 0.1 s; drivers still decide every 1 s as in the calibrated scenario.
# The scenario starts empty at its begin time (07:00): SUMO loads the 07:30 state of config/lust/make_state.sh.
*.traci.launcher.command = "%SUMO% --remote-port %PORT% --seed %SEED% --configuration-file %SUMOCFG% --message-log %RESULTDIR%/sumo-%RUN%.log --no-step-log --no-warnings --quit-on-end --step-length 0.1 --default.action-step-length 1 --begin 27000 --load-state config/lust/lust_0730.state.xml.gz"
*.traci.launcher.sumo = "sumo"
*.traci.core.startTime = 0s
*.traci.launcher.sumocfg = "config/lust/lust.sumocfg"
# Only vehicles inside config/lust/region.xml exist in the simulation; insertion stays staggered as on the grid.
*.traci.nodes.typename = "ExtensibleNodeManager"
*.traci.nodes.numVehiclePolicies = 2
*.traci.nodes.vehiclePolicy[0].typename = "RegionOfInterestVehiclePolicy"
*.traci.nodes.vehiclePolicy[0].regionsOfInterest = xmldoc("config/lust/region.xml")
*.traci.nodes.vehiclePolicy[1].typename = "InsertionDelayVehiclePolicy"

[Config lust-gui]
extends = lust
description = "LuST region of interest with SUMO-GUI Visualization"
*.traci.launcher.sumo = "sumo-gui"

[Config most]
description = "Monaco MoST City-Scale Map (07:00 AM Rush Hour)"
*.traci.launcher.sumo = "sumo"
*.traci.launcher.sumocfg = "../../sumo-scenarios/MoSTScenario/scenario/most.sumocfg"
*.traci.core.startTime = 0s

[Config most-gui]
description = "Monaco MoST City-Scale Map with SUMO-GUI Visualization"
*.traci.launcher.sumo = "sumo-gui"
*.traci.launcher.sumocfg = "../../sumo-scenarios/MoSTScenario/scenario/most.sumocfg"
*.traci.core.startTime = 0s

[Config highway]
description = "Highway Corridor Scenario"
*.traci.launcher.sumo = "sumo"
*.traci.launcher.sumocfg = "../../artery/scenarios/highway-police/highway.sumocfg"

[Config highway-gui]
