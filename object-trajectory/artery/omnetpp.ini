# =============================================================================
# Honest dataset run for the object-trajectory confidence experiment.
#
# This file EXTENDS cp-trustfulness/artery/omnetpp.ini rather than restating it. The scenario setup
# there -- LuST with its region of interest, GEMV^2 propagation, the radar field of view matching
# ITU-R M.2057-1 -- is the realistic configuration the project requires, and a second copy would
# drift from it silently. Only the service set and the error models are overridden here.
#
# MUST BE RUN FROM cp-trustfulness/artery/, because the base file's paths (config/lust/...,
# config/sensors.xml) are relative to that directory. That is why every path below starts with
# ../../ : they resolve against that working directory, not against this file. The one exception
# is the `include` above, which OMNeT++ resolves against this file's own directory.
#
#   cd cp-trustfulness/artery
#   docker exec -w /workspace/cp-trustfulness/artery artery \
#       $ARTERY_BUILD_DIR/run_artery -f ../../object-trajectory/artery/omnetpp.ini -c dataset-lust -u Cmdenv
#
# What comes out: ../../object-trajectory/dataset/groundtruth/{cam,cpm,reception}.csv + metadata.json
# =============================================================================

include ../../cp-trustfulness/artery/omnetpp.ini

[Config dataset-lust]
extends = lust
description = "60 s honest LuST trace: CAM/CPM content and reception, no error, no fault"

# --- the service set -------------------------------------------------------------------------
# Replaces the Paper-1 service stack with the generator. SensorNoiseService stays because it is what
# populates the objectStation oracle sender-side; it is configured error-free below, so it records
# ground truth without perturbing it.
*.node[*].middleware.services = xmldoc("../../object-trajectory/artery/services.xml")

# --- local perception sensors: Artery's reference arrangement --------------------------------
# The base configuration uses a front and a rear radar at 100 m / +-25 deg, from Recommendation
# ITU-R M.2057-1 Radar B. This experiment follows the collective-perception technical report
# instead -- and it turns out the two agree on where to look: ETSI TR 103 562 V2.1.1 Table 4,
# configuration 1 gives 65 m / +-40 deg and 150 m / +-5 deg, which is exactly what
# artery/scenarios/artery/omnetpp.ini already configures. The TR's clause 5.3.2.2 says the study
# ran on Artery's own environment model, and Table 4 sits in the ns-3 clause (5.3.3.2), which is
# why it labels the pair "Forward sensors" while Artery mirrors them front and rear.
#
#   short range:  65 m, aperture 80  (+-40 deg)
#   long range:  150 m, aperture 10  (+-5 deg)
#
# Table 4's configuration 2 (150 m, 360 deg) is not used: clause 5.3.2.2 calls it "an artificial
# setup ... to be able to generate large CP messages in specific scenarios".
*.node[*].environmentModel.sensors = xmldoc("../../object-trajectory/artery/sensors.xml")

*.node[*].environmentModel.FrontShortRangeRadar.fovRange = 65m
*.node[*].environmentModel.FrontShortRangeRadar.fovAngle = 80
*.node[*].environmentModel.FrontShortRangeRadar.numSegments = 4
*.node[*].environmentModel.FrontLongRangeRadar.fovRange = 150m
*.node[*].environmentModel.FrontLongRangeRadar.fovAngle = 10

*.node[*].environmentModel.RearShortRangeRadar.fovRange = 65m
*.node[*].environmentModel.RearShortRangeRadar.fovAngle = 80
*.node[*].environmentModel.RearShortRangeRadar.numSegments = 4
*.node[*].environmentModel.RearLongRangeRadar.fovRange = 150m
*.node[*].environmentModel.RearLongRangeRadar.fovAngle = 10

# numSegments is the polygon resolution of the cone; Artery's reference raises it only for the
# wide sensor and leaves the narrow one at the NED default of 1. Matched here.

# SensorNoiseService needs the same geometry to decide what an author could have seen.
# Format: range:aperture:mountYaw[:mountForward], mounted at the bumpers of a 5 m car.
*.node[*].middleware.Noise.sensorCoverage = "65:80:0:2.5,150:10:0:2.5,65:80:180:-2.5,150:10:180:-2.5"

# --- no error, by construction ---------------------------------------------------------------
# The MVP needs association statistics, not error statistics. Both models off means what is written
# is what the simulator knows. Error and faults are added later by subset_builder at ingestion time,
# which is the whole reason the recording is kept honest.
*.node[*].middleware.Noise.gnssErrorModel = "none"
*.node[*].middleware.Noise.radarErrorModel = "none"

# --- no faulty vehicles ----------------------------------------------------------------------
# Every vehicle honest: the mapper's dishonest types would inject attacks into the recording.
*.traci.mapper.vehicleTypes = xmldoc("../../object-trajectory/artery/vehicles-honest.xml")

# --- the generator ---------------------------------------------------------------------------
*.node[*].middleware.DatasetGenerator.outputDir = "../../object-trajectory/dataset/groundtruth"
*.node[*].middleware.DatasetGenerator.warmup = 10s
*.node[*].middleware.DatasetGenerator.cpmEncoding = "artery"

# --- recording ---------------------------------------------------------------------------------
# No OMNeT++ vectors. The base configuration records every vector from every module, which is right
# for Paper 1's analysis but pure overhead here: this run's output is the three CSVs the generator
# writes, and nothing reads the .vec database. Leaving it on cost ~4 GB of resident memory and got
# the first 70 s attempt OOM-killed at 45 % on a 7 GB host.
**.vector-recording = false
*.node[*].*.vector-recording = false
**.statistic-recording = false

# --- run length ------------------------------------------------------------------------------
# 60 s of trace after a 10 s warmup, during which vehicles are still being inserted and the
# neighbourhood size is not representative of anything.
sim-time-limit = 70s
result-dir = ../../object-trajectory/dataset/omnetpp-results

# --- memory ------------------------------------------------------------------------------------
# LuST at 10 Hz with GEMV^2 creates tens of millions of messages. Cmdenv's express mode keeps no
# per-event history, which is what makes a 70 s run fit.
cmdenv-express-mode = true
cmdenv-performance-display = true
